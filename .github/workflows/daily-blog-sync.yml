name: Daily Naver blog sync and Pages deploy
on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blog-sync-and-pages
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh public blog posts
        if: github.event_name != 'push'
        run: node scripts/sync-blog.mjs
      - name: Save blog changes
        if: github.event_name != 'push'
        run: |
          git add blog-posts.json public/assets/blog-thumb-*
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Naver blog posts and thumbnails'
            git push origin HEAD:main
          fi
      - name: Build Next.js static export
        run: npm run build
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
